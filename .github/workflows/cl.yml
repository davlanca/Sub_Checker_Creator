name: Sub Checker Creator

on:
  workflow_dispatch:
  repository_dispatch:
    types: [external_cron_trigger]

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-and-commit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: pip install requests psutil retrying PyYAML

      - name: Clean up old results before run
        run: |
          rm -f final.txt final_b64.txt \
            vless*.txt vmess*.txt trojan*.txt ss*.txt \
            hy2*.txt wireguard*.txt socks*.txt tuic*.txt ssr*.txt
          rm -rf loc/

      - name: Update Xray core to latest
        run: |
          set -euo pipefail

          curl -fSL \
            https://github.com/XTLS/Xray-core/releases/latest/download/Xray-linux-64.zip \
            -o /tmp/xray.zip

          unzip -t /tmp/xray.zip
          mkdir -p /tmp/xraydir
          unzip -o /tmp/xray.zip -d /tmp/xraydir
          install -m 755 /tmp/xraydir/xray xray/xray

      - name: Set execute permissions for binaries
        run: |
          chmod +x xray/xray
          chmod +x hy2/hysteria

      - name: Run the checker script
        run: python cl.py

      - name: Commit and push new results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A
          git reset -- .github/

          if ! git diff --cached --quiet; then
            echo "Changes detected. Committing and pushing..."
            git commit -m "chore: Update subscription results [skip ci]"
            git push
          else
            echo "No changes detected to commit."
          fi
